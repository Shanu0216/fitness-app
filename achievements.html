<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Achievements | FITZONE</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar">

<a href="index.html" class="logo">

<div class="logo-icon">💪</div>

FITZONE

</a>

</nav>


<section class="section">

<div class="section-title">

<h2>🏆 Achievements</h2>

<p>Earn XP and become a Fitness Champion</p>

</div>


<div class="xp-box">

<div class="xp-top">

<h3>Current Level</h3>

<h3 class="user-level">
Beginner
</h3>

</div>


<div class="progress-bar">

<div class="progress-fill"></div>

</div>


<p style="margin-top:15px;">

Total XP:
<span class="user-xp">0</span>

</p>

</div>


<div class="grid">


<div class="card achievement">

<div class="achievement-icon">
🌱
</div>

<div>

<h3>First Step</h3>

<p>Complete your first workout</p>

</div>

</div>


<div class="card achievement">

<div class="achievement-icon">
🔥
</div>

<div>

<h3>Workout Streak</h3>

<p>Complete 5 workouts</p>

</div>

</div>


<div class="card achievement">

<div class="achievement-icon">
⚡
</div>

<div>

<h3>XP Hunter</h3>

<p>Earn 500 XP</p>

</div>

</div>


<div class="card achievement">

<div class="achievement-icon">
🏆
</div>

<div>

<h3>Fitness Champion</h3>

<p>Reach 3000 XP</p>

</div>

</div>


</div>

</section>


<script src="script.js"></script>
