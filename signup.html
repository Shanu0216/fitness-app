<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sign Up | FITZONE</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="auth-container">

<div class="auth-box">

<h1>JOIN FITZONE</h1>

<p>Create your fitness account 💪</p>


<form onsubmit="signupUser(event)">


<div class="input-group">

<label>Username</label>

<input
type="text"
id="signupUsername"
required>

</div>


<div class="input-group">

<label>Password</label>

<input
type="password"
id="signupPassword"
required>

</div>


<div class="input-group">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
required>

</div>


<button
type="submit"
class="btn btn-primary full-btn">

Create Account

</button>


</form>


<p style="margin-top:20px;">

Already have an account?

<a
href="login.html"
style="color:#20e070;">

Login

</a>

</p>


</div>

</div>


<script src="script.js"></script>

</body>

</html>
