<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | FITZONE</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="auth-container">

<div class="auth-box">

<h1>FITZONE</h1>

<p>Welcome back, Warrior 💪</p>


<form onsubmit="loginUser(event)">


<div class="input-group">

<label>Username</label>

<input
type="text"
id="loginUsername"
required>

</div>


<div class="input-group">

<label>Password</label>

<input
type="password"
id="loginPassword"
required>

</div>


<button
type="submit"
class="btn btn-primary full-btn">

Login

</button>


</form>


<p style="margin-top:20px;">

Don't have an account?

<a
href="signup.html"
style="color:#20e070;">

Sign Up

</a>

</p>

</div>

</div>


<script src="script.js"></script>

</body>

</html>
